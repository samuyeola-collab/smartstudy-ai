<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartStudy AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #020617, #071330);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .register-box{
            width: 420px;
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(37,99,235,0.2);
            color: white;
        }

        h1{
            text-align: center;
            margin-bottom: 30px;
        }

        input{
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            color: white;
            outline: none;
        }

        button{
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            transition: 0.3s;
        }

        button:hover{
            background: #1d4ed8;
        }

        .message{
            text-align: center;
            margin-bottom: 20px;
            color: #4ade80;
        }

        a{
            color: #60a5fa;
            text-decoration: none;
        }

        .bottom{
            text-align: center;
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <div class="register-box">

        <h1>Create Account 🚀</h1>

        {% if message %}

        <div class="message">
            {{ message }}
        </div>

        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <div class="bottom">

            Already have account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</body>
</html>

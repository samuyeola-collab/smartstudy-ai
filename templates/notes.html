<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Generator - SmartStudy AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #020617, #0f172a);
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container-box{
            padding: 60px 20px;
            max-width: 1100px;
            margin: auto;
        }

        .title{
            text-align: center;
            margin-bottom: 50px;
        }

        .title h1{
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 15px;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow{

            from{
                text-shadow: 0 0 10px #2563eb;
            }

            to{
                text-shadow: 0 0 30px #60a5fa;
            }

        }

        .title p{
            color: #cbd5e1;
            font-size: 22px;
        }

        .form-box{
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        input{
            flex: 1;
            min-width: 250px;
            padding: 18px;
            border-radius: 14px;
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;
            outline: none;
            font-size: 17px;
        }

        input::placeholder{
            color: #94a3b8;
        }

        button{
            background: #2563eb;
            border: none;
            padding: 18px 30px;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover{
            background: #1d4ed8;
            transform: scale(1.05);
        }

        .notes-box{
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 25px;
            white-space: pre-line;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 0 25px rgba(37,99,235,0.15);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn{

            from{
                opacity: 0;
                transform: translateY(20px);
            }

            to{
                opacity: 1;
                transform: translateY(0);
            }

        }

        .notes-box h3{
            color: #60a5fa;
            font-size: 35px;
            margin-bottom: 20px;
        }

        .notes-box p{
            font-size: 18px;
            line-height: 1.9;
            color: #e2e8f0;
        }

        hr{
            border-color: rgba(255,255,255,0.1);
            margin-bottom: 25px;
        }

        .suggestions{
            margin-top: 20px;
            text-align: center;
            color: #94a3b8;
        }

        .tag{
            display: inline-block;
            background: rgba(37,99,235,0.2);
            padding: 8px 15px;
            margin: 6px;
            border-radius: 12px;
            font-size: 15px;
        }

        .footer{
            text-align: center;
            margin-top: 60px;
            color: #94a3b8;
        }

        @media(max-width:768px){

            .title h1{
                font-size: 42px;
            }

            .title p{
                font-size: 18px;
            }

            .notes-box{
                padding: 25px;
            }

        }

    </style>
</head>
<body>

    <div class="container-box">

        <!-- Title -->

        <div class="title">

            <h1>AI Notes Generator 📝</h1>

            <p>
                Generate smart study notes instantly with SmartStudy AI
            </p>

        </div>

        <!-- Form -->

        <form method="POST" class="form-box">

            <input
                type="text"
                name="topic"
                placeholder="Enter topic (Python, AI, HTML, CSS...)"
                required
            >

            <button type="submit">
                Generate Notes
            </button>

        </form>

        <!-- Suggestions -->

        <div class="suggestions">

            <span class="tag">Python</span>
            <span class="tag">Artificial Intelligence</span>
            <span class="tag">HTML</span>
            <span class="tag">CSS</span>
            <span class="tag">Java</span>
            <span class="tag">Flask</span>

        </div>

        <!-- Notes Result -->

        {% if generated_notes %}

        <div class="notes-box mt-5">

            <h3>
                📘 {{ topic }}
            </h3>

            <hr>

            <p>{{ generated_notes }}</p>
            <br>

<a href="/download_notes/{{ topic }}">

    <button>
        Download PDF 📄
    </button>

</a>

        </div>

        {% endif %}

        <!-- Footer -->

        <div class="footer">

            <p>
                SmartStudy AI 🚀 | Intelligent Learning Platform
            </p>

        </div>

    </div>

</body>
</html>

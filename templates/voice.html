<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant - SmartStudy AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: #020617;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container-box{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .mic-button{
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 60px;
            transition: 0.3s;
            margin-top: 20px;
        }

        .mic-button:hover{
            transform: scale(1.1);
            background: #1d4ed8;
        }

        .box{
            width: 70%;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            margin-top: 30px;
            font-size: 20px;
        }

        .user{
            border-left: 5px solid #2563eb;
        }

        .bot{
            border-left: 5px solid #22c55e;
        }

    </style>
</head>
<body>

    <div class="container-box">

        <h1>SmartStudy AI Voice Assistant 🎤🤖</h1>

        <p>Click microphone and ask anything</p>

        <button class="mic-button" onclick="startListening()">
            🎤
        </button>

        <div class="box user">
            <strong>You:</strong>
            <p id="userText">Waiting for speech...</p>
        </div>

        <div class="box bot">
            <strong>SmartStudy AI:</strong>
            <p id="botText">Waiting for your question...</p>
        </div>

    </div>

    <script>

        function startListening(){

            const recognition =
                new webkitSpeechRecognition();

            recognition.lang = "en-US";

            recognition.start();

            recognition.onresult = function(event){

                const text = event.results[0][0].transcript;

                document.getElementById("userText").innerHTML = text;

                generateResponse(text);
            };
        }

        function generateResponse(message){

            let response = "";

            let msg = message.toLowerCase();

            if(msg.includes("python")){

                response =
                "Python is a powerful programming language used for AI, web development, and data science.";

            }

            else if(msg.includes("ai")){

                response =
                "Artificial Intelligence enables machines to simulate human intelligence.";

            }

            else if(msg.includes("html")){

                response =
                "HTML is used to create the structure of web pages.";

            }

            else if(msg.includes("css")){

                response =
                "CSS is used to style and design websites.";

            }

            else if(msg.includes("java")){

                response =
                "Java is an object-oriented programming language.";

            }

            else{

                response =
                "Sorry, I am still learning this topic.";
            }

            document.getElementById("botText").innerHTML = response;

            speak(response);
        }

        function speak(text){

            const speech =
                new SpeechSynthesisUtterance();

            speech.text = text;

            speech.volume = 1;

            speech.rate = 1;

            speech.pitch = 1;

            window.speechSynthesis.speak(speech);
        }

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - SmartStudy AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: #020617;
            color: white;
            font-family: Arial, sans-serif;
        }

        .sidebar{
            width: 250px;
            height: 100vh;
            background: rgba(255,255,255,0.05);
            position: fixed;
            padding: 30px 20px;
        }

        .sidebar h2{
            margin-bottom: 40px;
        }

        .sidebar a{
            display: block;
            color: white;
            text-decoration: none;
            margin: 20px 0;
            font-size: 18px;
        }

        .chat-container{
            margin-left: 270px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header{
            padding: 20px;
            font-size: 30px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .chat-box{
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message{
            max-width: 70%;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-size: 17px;
        }

        .user{
            background: #2563eb;
            margin-left: auto;
        }

        .bot{
            background: rgba(255,255,255,0.08);
        }

        .chat-input{
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .chat-input input{
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;
            outline: none;
        }

        .chat-input button{
            background: #2563eb;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            transition: 0.3s;
        }

        .chat-input button:hover{
            background: #1d4ed8;
        }

    </style>
</head>
<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>SmartStudy AI 🚀</h2>

        <a href="/dashboard">🏠 Dashboard</a>
        <a href="/chatbot">🤖 AI Chatbot</a>
        <a href="#">🎤 Voice Assistant</a>
        <a href="#">📝 Notes Generator</a>
        <a href="#">📚 Quiz System</a>
        <a href="#">📈 Progress Tracker</a>

    </div>

    <!-- Chat Area -->

    <div class="chat-container">

        <div class="chat-header">
            AI Chatbot 🤖
        </div>

        <!-- Chat Messages -->

        <div class="chat-box">

            {% if user_message %}

            <div class="message user">
                {{ user_message }}
            </div>

            <div class="message bot">
                {{ bot_response }}
            </div>

            {% else %}

            <div class="message bot">
                Hello 👋 <br>
                I am your SmartStudy AI assistant.
            </div>

            {% endif %}

        </div>

        <!-- Input Form -->

        <form method="POST" class="chat-input">

            <input
                type="text"
                name="message"
                placeholder="Type your message..."
                required
            >

            <button type="submit">
                Send
            </button>

        </form>

    </div>

</body>
</html>

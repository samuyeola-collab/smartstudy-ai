<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SmartStudy AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #020617, #071330);
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .profile-box{
            max-width: 700px;
            margin: auto;
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(37,99,235,0.2);
        }

        .avatar{
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            font-size: 60px;
            margin-bottom: 25px;
        }

        h1{
            margin-bottom: 10px;
        }

        p{
            color: #cbd5e1;
            font-size: 18px;
        }

        .stats{
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .card-box{
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 20px;
        }

        .card-box h2{
            color: #60a5fa;
        }

        a{
            display: inline-block;
            margin-top: 35px;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
        }

    </style>
</head>
<body>

    <div class="profile-box">

        <div class="avatar">
            👩‍🎓
        </div>

        <h1>{{ username }}</h1>

        <p>{{ email }}</p>

        <div class="stats">

            <div class="card-box">

                <h2>{{ total_quizzes }}</h2>

                <p>Quizzes Attempted</p>

            </div>

            <div class="card-box">

                <h2>AI</h2>

                <p>Smart Learning</p>

            </div>

            <div class="card-box">

                <h2>Cloud</h2>

                <p>Firebase Connected</p>

            </div>

        </div>

        <a href="/dashboard">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
